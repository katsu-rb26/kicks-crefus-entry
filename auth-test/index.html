<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>認証方式PoC - テストB (GitHub Pages)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    #result, #log { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; margin-top: 16px; font-size: 13px; }
    .ok { color: #0a7d2c; font-weight: bold; }
    .ng { color: #c0392b; font-weight: bold; }
  </style>
</head>
<body>
  <h1>テストB: GitHub Pages → GAS(/exec) 連携</h1>

  <!-- GAS検証用デプロイの /exec URL -->
  <div id="g_id_onload"
       data-client_id="796082042718-r5rrmp24gvierdjvhfap0jrfk63me5qd.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <div id="result">未ログイン</div>
  <h2 style="font-size:14px;">ログ</h2>
  <div id="log"></div>

  <script>
    // 検証用GASデプロイの /exec URL（本番とは無関係の別プロジェクト）
    var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbx4FhEcpwkl3StySR58fFQqUU5-kb0bfy63NuNhgfESzQ_FoHQnvYIuwceVGpG2bRIFYQ/exec';

    var logEl = document.getElementById('log');
    function appendLog(msg) {
      logEl.textContent += msg + '\n';
    }

    window.addEventListener('error', function (e) {
      appendLog('[window error] ' + e.message);
    });

    var origConsoleError = console.error;
    console.error = function () {
      appendLog('[console.error] ' + Array.prototype.slice.call(arguments).join(' '));
      origConsoleError.apply(console, arguments);
    };

    function postToGas(action, extra) {
      var body = Object.assign({ action: action }, extra);
      return fetch(GAS_EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // プリフライト回避のためtext/plain固定
        body: JSON.stringify(body)
      }).then(function (res) {
        return res.json();
      });
    }

    function handleCredentialResponse(response) {
      appendLog('ID token received (length=' + (response.credential || '').length + ')');
      document.getElementById('result').textContent = 'ログイン処理中...';

      postToGas('login', { idToken: response.credential })
        .then(function (loginResult) {
          appendLog('login result: ' + JSON.stringify(loginResult));

          if (!loginResult.ok || !loginResult.allowed) {
            renderResult(loginResult, null);
            return;
          }

          return postToGas('whoami', { sessionToken: loginResult.sessionToken })
            .then(function (whoamiResult) {
              appendLog('whoami result: ' + JSON.stringify(whoamiResult));
              renderResult(loginResult, whoamiResult);
            });
        })
        .catch(function (err) {
          appendLog('[fetch error] ' + err.message);
          document.getElementById('result').innerHTML = '<span class="ng">通信エラー: ' + err.message + '</span>';
        });
    }

    function renderResult(loginResult, whoamiResult) {
      var el = document.getElementById('result');
      if (loginResult.ok && loginResult.allowed && whoamiResult && whoamiResult.ok) {
        el.innerHTML = '<span class="ok">許可: ' + whoamiResult.email + '</span>\nsessionToken: ' + loginResult.sessionToken;
      } else if (loginResult.ok && !loginResult.allowed) {
        el.innerHTML = '<span class="ng">不許可: ' + loginResult.email + ' (' + loginResult.reason + ')</span>';
      } else {
        el.innerHTML = '<span class="ng">検証エラー: ' + loginResult.reason + '</span>';
      }
    }
  </script>
</body>
</html>
